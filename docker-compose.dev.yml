services:
  postgres:
    image: postgres:16-alpine
    container_name: clinika_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinika
      POSTGRES_USER: clinika
      POSTGRES_PASSWORD: clinika_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinika -d clinika"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
